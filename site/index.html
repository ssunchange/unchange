<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポートフォリオ | Webディレクター</title>
<meta name="description" content="Webディレクターのポートフォリオ。担当した案件と、そこでの判断をまとめています。">
<style>
:root {
  --bg: #ffffff;
  --bg-subtle: #f6f6f4;
  --text: #1a1a18;
  --text-muted: #6b6b66;
  --border: #e2e2dd;
  --accent: #b4532a;
  --max: 44rem;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161614;
    --bg-subtle: #1f1e1b;
    --text: #ecebe7;
    --text-muted: #a3a099;
    --border: #32302c;
    --accent: #e08155;
  }
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
  font-size: 16px;
  line-height: 1.9;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: var(--max);
  margin: 0 auto;
  padding: 0 1.5rem;
}

/* ヘッダー */

.hero {
  padding: 5rem 0 3.5rem;
  border-bottom: 1px solid var(--border);
}

.hero h1 {
  margin: 0 0 .5rem;
  font-size: clamp(1.75rem, 5vw, 2.5rem);
  line-height: 1.4;
  letter-spacing: .02em;
}

.hero .role {
  margin: 0 0 2rem;
  color: var(--accent);
  font-size: .95rem;
  font-weight: 600;
  letter-spacing: .08em;
}

.hero .lead {
  margin: 0;
  font-size: 1.05rem;
}

/* セクション共通 */

section { padding: 3.5rem 0; }
section + section { border-top: 1px solid var(--border); }

h2 {
  margin: 0 0 1.75rem;
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: .16em;
  color: var(--text-muted);
}

h3 {
  margin: 0 0 .4rem;
  font-size: 1.1rem;
  line-height: 1.6;
}

p { margin: 0 0 1.25rem; }
p:last-child { margin-bottom: 0; }

/* できること */

.skills {
  display: grid;
  gap: 1.75rem;
  grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
}

.skills h3 { font-size: 1rem; }

.skills p {
  margin: 0;
  color: var(--text-muted);
  font-size: .92rem;
}

/* 実績 */

.works { display: grid; gap: 1rem; }

.work {
  display: block;
  padding: 1.5rem;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: .5rem;
  color: inherit;
  text-decoration: none;
  transition: border-color .15s ease;
}

a.work:hover, a.work:focus-visible { border-color: var(--accent); }

.work .meta {
  margin: 0 0 .75rem;
  color: var(--text-muted);
  font-size: .82rem;
  letter-spacing: .04em;
}

.work p:last-child {
  margin: 0;
  color: var(--text-muted);
  font-size: .92rem;
}

.empty {
  padding: 2.5rem 1.5rem;
  border: 1px dashed var(--border);
  border-radius: .5rem;
  text-align: center;
  color: var(--text-muted);
  font-size: .92rem;
}

/* 連絡先 */

.contact a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: .25em;
}

/* フッター */

footer {
  padding: 2.5rem 0 4rem;
  border-top: 1px solid var(--border);
  color: var(--text-muted);
  font-size: .82rem;
}
</style>
</head>
<body>

<!--
  ▼ 書き換える場所には「★」を付けています。
     文言はすべて仮です。自分の言葉に置き換えてください。
-->

<header class="hero">
  <div class="wrap">
    <!-- ★ 名前 -->
    <h1>あなたの名前</h1>
    <p class="role">WEB DIRECTOR</p>
    <!-- ★ 自己紹介。3行以内。「何ができる人か」が伝わる書き方にする -->
    <p class="lead">
      Webサイトの企画から公開までを担当しています。要件を整理し、関係者の認識を揃え、
      期日までに形にすることを仕事にしています。
    </p>
  </div>
</header>

<main>

  <section>
    <div class="wrap">
      <h2>できること</h2>
      <div class="skills">
        <!-- ★ 3つ前後。抽象語だけにせず、具体的な作業が浮かぶ書き方にする -->
        <div>
          <h3>要件定義</h3>
          <p>やりたいことを聞き出し、やらないことまで含めて文書にします。</p>
        </div>
        <div>
          <h3>進行管理</h3>
          <p>制作チームと発注者の間に立ち、判断が止まらないよう段取りします。</p>
        </div>
        <div>
          <h3>制作ディレクション</h3>
          <p>デザインと実装の品質を、公開できる水準まで引き上げます。</p>
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <h2>実績</h2>
      <div class="works">

        <!-- ★ 実績がまだ0件のときの表示。1件目を追加したら、この div を消す -->
        <div class="empty">実績を準備中です。</div>

        <!--
          ★ 実績を追加するときは、下のコメントを外して複製します。
             1件 = 1ブロック。新しいものを上に置きます。

        <article class="work">
          <p class="meta">食品メーカー ／ コーポレートサイト ／ 2025年</p>
          <h3>スマホ経由の問い合わせを1.7倍にしたリニューアル</h3>
          <p>アクセスの6割を占めるスマートフォンで問い合わせが発生していなかった。導線を作り直し、フォームの入力項目を12から5に減らした。</p>
        </article>

        -->

      </div>
    </div>
  </section>

  <section class="contact">
    <div class="wrap">
      <h2>連絡先</h2>
      <!-- ★ 公開して問題のない連絡先だけを書く。私用のメールアドレスは避ける -->
      <p><a href="mailto:your-address@example.com">your-address@example.com</a></p>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">
    <!-- ★ 名前 -->
    <p>&copy; あなたの名前</p>
  </div>
</footer>

</body>
</html>
